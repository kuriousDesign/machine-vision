services:
  machine-vision:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      network: host  # <--- THIS IS THE FIX for the build hang
    container_name: machine_vision
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file: .env
    
    volumes:
      - ./src:/app/src
      - /opt/recordings:/opt/recordings
      - /run/udev:/run/udev:ro  # <--- CRITICAL: Provides the udev database
      - /dev:/dev               # <--- CRITICAL: Provides the device nodes
    group_add:
      - video
      - plugdev
    # environment:
    #   - MQTT_BROKER=mosquitto
    #   - MQTT_PORT=1883
    #   - MONGO_URI=mongodb://mongo:27017


volumes:
  mongo_data_dev:
